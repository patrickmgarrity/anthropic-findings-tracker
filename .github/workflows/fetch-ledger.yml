name: fetch-anthropic-mythos-ledger

on:
  schedule:
    # Every 6 hours, on the hour, UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch:    # allow manual runs
  push:
    paths:
      - 'scripts/fetch_ledger.py'
      - '.github/workflows/fetch-ledger.yml'

permissions:
  contents: write   # required so the workflow can commit data/ updates

concurrency:
  group: mythos-ledger
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No dependencies required for the tracker itself. matplotlib
          # is installed below solely so the chart step can render PNG
          # alongside the SVG.

      - name: Install chart dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'matplotlib>=3.8,<4'

      - name: Run tracker
        env:
          LOG_LEVEL: INFO
        run: |
          python scripts/fetch_ledger.py

      - name: Regenerate cumulative chart
        run: |
          python scripts/generate_chart.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git add data/
          # Build a concise commit message from state.json
          run_iso=$(python -c "import json; print(json.load(open('data/state.json')).get('last_run_utc',''))")
          entries=$(python -c "import json; print(json.load(open('data/state.json')).get('entry_count',''))")
          git commit -m "data: refresh ledger ${run_iso} (${entries} entries)"
          git push
